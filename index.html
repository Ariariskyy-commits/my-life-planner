<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Y2K Planner</title>
    <!-- ใส่ลิงก์ CSS เดิมของคุณตรงนี้ (ถ้ามีแยกไฟล์) หรือใช้สไตล์ด้านล่างนี้ได้เลย -->
    <style>
        /* บังคับสเกลหน้าจอให้เต็มมือถือพอดี ไม่ล้นและไม่มีช่องว่าง */
        html, body {
            width: 100% !important;
            min-height: 100vh !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow-x: hidden !important;
            background-color: #f0f4f8 !important;
            box-sizing: border-box !important;
        }

        body > *, .container, .main-wrapper, div[class*="container"] {
            width: 100% !important;
            max-width: 100% !important;
            margin-left: 0 !important;
            margin-right: 0 !important;
            padding-left: 12px !important;
            padding-right: 12px !important;
            box-sizing: border-box !important;
        }
    </style>
</head>
<body>
    <!-- 
      * วางเนื้อหา/โค้ดเดิมของคุณทั้งหมดไว้ตรงนี้ 
      * แทนที่ตรงคอมเมนต์นี้ด้วยโค้ดเนื้อหาเดิมของคุณได้เลยครับ
    -->
</body>
</html>
